name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: threadextract_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CI_DATABASE_URL: postgresql://ci:ci@localhost:5432/threadextract_ci?schema=public
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prisma generate
      - run: pnpm lint
      - run: pnpm exec tsc --noEmit
      - run: pnpm test

      - name: Build
        run: pnpm build
        env:
          # Dummy-but-shape-valid values so build-time module evaluation
          # (fail-fast checks in crypto.ts / claim-token.ts, Stripe/NextAuth
          # client construction) doesn't crash the build. None of these are
          # real credentials — this step never runs prisma db push or
          # deploys anywhere (the e2e step below is what touches a real DB).
          DATABASE_URL: postgresql://user:pass@localhost:5432/db
          SLACK_CLIENT_ID: dummy
          SLACK_CLIENT_SECRET: dummy
          SLACK_SIGNING_SECRET: dummy
          GEMINI_API_KEYS: dummy
          GROQ_API_KEYS: dummy
          NEXT_PUBLIC_BASE_URL: http://localhost:3000
          TOKEN_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          CLAIM_TOKEN_SECRET: dummy-secret-at-least-32-chars-long-for-ci
          NEXTAUTH_SECRET: dummy-secret-at-least-32-chars-long-for-ci
          NEXTAUTH_URL: http://localhost:3000
          GOOGLE_CLIENT_ID: dummy
          GOOGLE_CLIENT_SECRET: dummy
          RESEND_API_KEY: dummy
          EMAIL_FROM: "ThreadExtract <hello@korrali.com>"
          STRIPE_SECRET_KEY: sk_test_dummy
          STRIPE_WEBHOOK_SECRET: whsec_dummy
          STRIPE_PRICE_PRO_MONTHLY: price_dummy
          STRIPE_PRICE_PRO_ANNUAL: price_dummy

      - name: Push schema to the ephemeral CI database
        run: pnpm exec prisma db push --accept-data-loss
        env:
          DATABASE_URL: ${{ env.CI_DATABASE_URL }}

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E tests
        run: pnpm test:e2e
        env:
          # Overrides .env.test's DATABASE_URL (which assumes a local
          # Homebrew Postgres role) to point at the CI service container
          # instead — @next/env only applies .env.test values for vars not
          # already present in process.env, so this step-level env wins.
          DATABASE_URL: ${{ env.CI_DATABASE_URL }}
          # Real credentials for e2e/ai-notion-roundtrip.spec.ts — that test
          # self-skips (test.skip) if any of these are unset, so CI stays
          # green even before these secrets are configured in repo settings.
          # Set via: Settings -> Secrets and variables -> Actions.
          E2E_NOTION_TOKEN: ${{ secrets.E2E_NOTION_TOKEN }}
          E2E_NOTION_DATABASE_ID: ${{ secrets.E2E_NOTION_DATABASE_ID }}
          GEMINI_API_KEYS: ${{ secrets.E2E_GEMINI_API_KEY }}

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
